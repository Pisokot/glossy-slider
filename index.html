<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Писокоть Великолепный</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #ffffff;
    font-family: Arial, sans-serif;
}

.slider {
    position: relative;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    overflow: hidden;
    line-height: 0;
}

.slider > img {
    display: block;
    width: 100%;
    height: auto;
}

.after {
    position: absolute;
    top: 0;
    left: 0;
    width: 50%;
    height: 100%;
    overflow: hidden;
}

.after img {
    display: block;
    width: 100%;
    max-width: none;
    height: auto;
}

.handle {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 3px;
    background: #ffffff;
    transform: translateX(-50%);
    box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
    pointer-events: none;
}

.handle::after {
    content: "↔";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #ffffff;
    color: #222222;
    font-size: 22px;
    line-height: 44px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
}

.slider input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: ew-resize;
}
</style>
</head>

<body>

<div class="slider">

    <img src="original.png" alt="">

    <div class="after">
        <img src="satire.png" alt="">
    </div>

    <div class="handle"></div>

    <input
        type="range"
        min="0"
        max="100"
        value="50"
        aria-label="Сравнить изображения"
    >

</div>

<script>
const slider = document.querySelector(".slider");
const after = slider.querySelector(".after");
const handle = slider.querySelector(".handle");
const range = slider.querySelector("input");

function updateSlider(value) {
    after.style.width = value + "%";
    handle.style.left = value + "%";
}

range.addEventListener("input", function () {
    updateSlider(this.value);
});
</script>

</body>
</html>
